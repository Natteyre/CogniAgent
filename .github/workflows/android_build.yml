name: Kompilacja CogniAgent APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Budowanie Aplikacji
    runs-on: ubuntu-latest

    steps:
    # 1. Pobranie kodu źródłowego z repozytorium
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Skonfigurowanie środowiska Java (Wymagane JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 3. Automatyczne wygenerowanie właściwej wersji Gradle 9.3.1
    - name: Generate Correct Gradle Wrapper
      run: gradle wrapper --gradle-version 9.3.1

    # 4. Nadanie uprawnień wykonywalnych dla skryptu gradlew
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # 5. Zaawansowane buforowanie Gradle dla przyspieszenia kompilacji
    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v4

    # 6. POPRAWKA: Wymuszamy uruchomienie KSP2 w osobnym procesie JVM (Headless Mode)
    - name: Configure Headless KSP2 for CI Environment
      run: |
        echo "ksp.useKSP2=true" >> gradle.properties
        echo "ksp.run.in.process=false" >> gradle.properties
        echo "ksp.incremental=false" >> gradle.properties

    # 7. Tworzenie atrap (placeholders) plików konfiguracyjnych środowiska
    - name: Create Environment Secrets Placeholders
      run: |
        touch .env
        echo "GEMINI_API_KEY=ci_build_dummy_placeholder_key" >> .env
        touch debug.keystore

    # 8. Kompilacja właściwa – Budowanie pliku APK z izolacją wątków procesora
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.workers.max=2

    # 9. Wypchnięcie gotowego pliku .apk jako bezpiecznego artefaktu GitHub Actions
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CogniAgent-Android-Install-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
