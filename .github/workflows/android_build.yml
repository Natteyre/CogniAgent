name: Kompilacja CogniAgent APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Budowanie i Testowanie Aplikacji
    runs-on: ubuntu-latest

    steps:
    # 1. Pobranie kodu źródłowego z repozytorium
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Skonfigurowanie środowiska Java (Wymagane JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 3. POPRAWKA: Automatyczne wygenerowanie brakującego pliku gradlew w środowisku CI
    - name: Generate Missing Gradle Wrapper
      run: gradle wrapper --gradle-version 8.7

    # 4. Nadanie uprawnień wykonywalnych dla nowo utworzonego skryptu gradlew
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # 5. Zaawansowane buforowanie Gradle dla przyspieszenia kompilacji
    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v4

    # 6. Tworzenie atrap (placeholders) plików konfiguracyjnych środowiska
    - name: Create Environment Secrets Placeholders
      run: |
        touch .env
        echo "GEMINI_API_KEY=ci_build_dummy_placeholder_key" >> .env
        touch debug.keystore

    # 7. Uruchomienie testów jednostkowych (JUnit + Robolectric)
    - name: Run Robolectric and Unit Tests
      run: ./gradlew testDebugUnitTest

    # 8. Kompilacja właściwa – Generowanie instalacyjnego pliku APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 9. Wypchnięcie gotowego pliku .apk jako bezpiecznego artefaktu GitHub Actions
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CogniAgent-Android-Install-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
